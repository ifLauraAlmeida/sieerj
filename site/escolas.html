<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="author" content="Laura Almeida">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Buscar escolas — SIEERJ</title>
  <meta name="description" content="Busca de escolas do Estado do Rio de Janeiro por nome, código INEP, município, rede, localização e etapa.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Raleway:wght@400;600;700&display=swap">
  <link rel="stylesheet" href="css/estilo.css">
  <script src="js/tema-inicial.js"></script>
</head>
<body>
  <a class="pular-conteudo" href="#conteudo">Pular para o conteúdo</a>
  <header id="cabecalho" class="cabecalho"></header>

  <main id="conteudo" class="container">
    <h1>Buscar escolas</h1>
    <p class="subtitulo">Filtre por nome, código INEP, município, dependência administrativa, localização, situação ou etapa oferecida.</p>

    <form id="filtros" class="filtros" role="search">
      <label class="filtro-texto">Nome ou código INEP
        <input type="search" name="texto" placeholder="Ex.: Colégio Pedro II ou 33036594" autocomplete="off">
      </label>
      <label>Município
        <select name="municipio"><option value="">Todos</option></select>
      </label>
      <label>Dependência
        <select name="dependencia"><option value="">Todas</option></select>
      </label>
      <label>Localização
        <select name="localizacao"><option value="">Todas</option></select>
      </label>
      <label>Situação
        <select name="situacao"><option value="">Todas</option></select>
      </label>
      <label>Etapa oferecida
        <select name="etapa"><option value="">Todas</option></select>
      </label>
      <button class="botao botao-secundario" type="reset">Limpar filtros</button>
    </form>

    <div id="resultados"><p class="carregando">Carregando índice de escolas…</p></div>
  </main>

  <footer id="rodape" class="rodape"></footer>
  <script type="module" src="js/pagina-escolas.js"></script>
</body>
</html>
